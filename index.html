<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punto Alto - Reservas</title>
    <!-- FullCalendar CSS & JS -->
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css' rel='stylesheet' />
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js'></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #f2f2f7;
            margin: 0;
            padding: 15px;
            color: #1c1c1e;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }
        .header {
            text-align: center;
            margin-bottom: 15px;
        }
        .header h1 {
            font-size: 24px;
            margin: 0 0 10px 0;
            font-weight: 700;
        }
        .instructions-badge {
            display: inline-block;
            background-color: #fff2f2;
            color: #d93838;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }
        /* FullCalendar Custom Styling */
        .fc {
            --fc-border-color: #f0f0f0;
            --fc-button-bg-color: #1c1c1e;
            --fc-button-border-color: #1c1c1e;
            --fc-button-hover-bg-color: #3a3a3c;
            --fc-button-hover-border-color: #3a3a3c;
            --fc-button-active-bg-color: #000000;
            --fc-button-active-border-color: #000000;
        }
        .fc .fc-toolbar-title {
            font-size: 18px;
            font-weight: 700;
        }
        .fc .fc-button {
            border-radius: 10px !important;
            padding: 6px 12px;
            font-weight: 600;
            font-size: 13px;
        }
        .fc-theme-standard th {
            padding: 8px 0;
            background-color: #1c1c1e;
            color: #ffffff;
            font-size: 12px;
            border: none !important;
        }
        .fc-theme-standard th:first-child { border-top-left-radius: 8px; border-bottom-left-radius: 8px; }
        .fc-theme-standard th:last-child { border-top-right-radius: 8px; border-bottom-right-radius: 8px; }
        .fc-daygrid-day-frame {
            min-height: 55px !important;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 4px;
            border-radius: 8px;
        }
        .fc-daygrid-day-number {
            font-weight: 600;
            font-size: 14px;
            padding: 0 !important;
            color: #1c1c1e;
        }
        .day-status {
            font-size: 9px;
            font-weight: 700;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        /* Custom Selection Colors */
        .selected-day {
            background-color: #1c1c1e !important;
        }
        .selected-day .fc-daygrid-day-number,
        .selected-day .day-status {
            color: #ffffff !important;
        }
        .in-range-day {
            background-color: #e5e5ea !important;
        }

        /* Legend */
        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 15px 0;
            font-size: 13px;
            color: #666;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .legend-box {
            width: 14px;
            height: 14px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        .legend-box.available { background: #ffffff; }
        .legend-box.occupied { background: #ffe5e5; border-color: #ffb3b3; }

        /* Summary & Button Panel */
        .action-panel {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .summary-card {
            background: #f9f9fb;
            border: 1px solid #e5e5ea;
            padding: 12px 15px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #1c1c1e;
        }
        .btn-action {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: opacity 0.2s;
        }
        .btn-clear {
            background-color: #f2f2f7;
            color: #3a3a3c;
            border: 1px solid #e5e5ea;
        }
        .btn-whatsapp {
            background-color: #25d366;
            color: #ffffff;
        }
        .btn-action:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Punto Alto</h1>
            <div class="instructions-badge">📍 Tocá las fechas que querés reservar</div>
        </div>

        <div id="calendar"></div>

        <div class="legend">
            <div class="legend-item">
                <div class="legend-box available"></div> Disponible
            </div>
            <div class="legend-item">
                <div class="legend-box occupied"></div> Ocupado
            </div>
        </div>

        <div class="action-panel">
            <div id="summary-card" class="summary-card" style="display: none;">
                ✅ <span id="summary-text"></span>
            </div>

            <button id="btn-clear" class="btn-action btn-clear" style="display: none;" onclick="clearSelection()">
                🗑️ Limpiar selección
            </button>

            <a id="btn-whatsapp" href="#" target="_blank" class="btn
