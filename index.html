<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Punto Alto - Reservas</title>
<!-- FullCalendar JS -->
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
<style>
:root {
  --primary: #1c1c1c;
  --secondary: #ffffff;
  --accent: #f9f9fb;
  --border: #e5e5ea;
  --text: #1c1c1c;
  --text-light: #666666;
  --success: #25d366;
  --error: #ff3b3b;
}
* {
  box-sizing: border-box;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
body {
  background-color: #f2f2f7;
  margin: 0;
  padding: 15px;
  color: var(--text);
}
.container {
  max-width: 500px;
  margin: 0 auto;
  background: var(--secondary);
  padding: 20px;
  border-radius: 20px;
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
}
.header {
  text-align: center;
  margin-bottom: 15px;
}
.header h1 {
  font-size: 24px;
  margin: 0 0 10px 0;
  font-weight: 700;
}
.instructions-badge {
  display: inline-block;
  background-color: var(--accent);
  color: var(--text-light);
  padding: 8px 14px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
}
#calendar {
  margin-top: 15px;
}
.legend {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin: 15px 0;
  font-size: 13px;
  color: var(--text-light);
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
}
.legend-box {
  width: 14px;
  height: 14px;
  border-radius: 4px;
  border: 1px solid #ccc;
}
.legend-box.available { background: var(--secondary); }
.legend-box.occupied { background: var(--border); opacity: 0.6; }

/* FullCalendar Custom Styling */
.fc {
  --fc-border-color: var(--border);
  --fc-button-bg-color: var(--text);
  --fc-button-border-color: var(--text);
  --fc-button-hover-bg-color: #3a3a3c;
  --fc-button-active-bg-color: #000000;
  --fc-today-bg-color: transparent;
}
.fc .fc-toolbar-title {
  font-size: 18px;
  font-weight: 700;
}
.fc .fc-button {
  border-radius: 10px !important;
  padding: 6px 12px;
  font-weight: 600;
  font-size: 13px;
}
.fc-theme-standard th {
  padding: 8px 0;
  background-color: var(--text);
  color: var(--secondary);
  font-size: 12px;
  border: none !important;
}
.fc-daygrid-day-frame {
  min-height: 55px !important;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  padding: 4px;
  border-radius: 8px;
  cursor: pointer;
  transition: background-color 0.2s ease;
}
.fc-day-future:hover {
  background-color: var(--accent) !important;
}
.fc-daygrid-day-number {
  font-weight: 600;
  font-size: 14px;
  color: var(--text);
  text-decoration: none;
}
.fc-day-past {
  background: var(--accent) !important;
  cursor: not-allowed;
  opacity: 0.5;
}
.day-selected {
  background-color: var(--text) !important;
}
.day-selected .fc-daygrid-day-number {
  color: var(--secondary) !important;
}
.day-status {
  font-size: 9px;
  font-weight: 700;
  color: #666;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* Summary & Button Panel */
.action-panel {
  margin-top: 15px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.summary-card {
  background: var(--accent);
  border: 1px solid var(--border);
  padding: 12px 15px;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--text);
}
.btn-action {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 700;
  border: none;
  cursor: pointer;
  text-align: center;
  text-decoration: none;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: opacity 0.2s;
}
.btn-clear {
  background-color: var(--secondary);
  color: var(--text);
  border: 1px solid var(--border);
}
.btn-whatsapp {
  background-color: var(--success);
  color: #ffffff;
}
.btn-action:hover { opacity: 0.9; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Punto Alto</h1>
    <div class="instructions-badge">📌 Tocá las fechas que querés reservar</div>
  </div>
  <div id="calendar"></div>
  <div class="legend">
    <div class="legend-item">
      <div class="legend-box available"></div> Disponible
    </div>
    <div class="legend-item">
      <div class="legend-box occupied"></div> Ocupado
    </div>
  </div>
  <div class="action-panel">
    <div id="summary-card" class="summary-card" style="display: none;">
      ✅ <span id="summary-text"></span>
    </div>
    <button id="btn-clear" class="btn-action btn-clear" style="display: none;" onclick="clearSelection()">
      Limpiar selección
    </button>
    <a id="btn-whatsapp" href="#" target="_blank" class="btn-action btn-whatsapp" style="display: none;">
      Reservar por WhatsApp
    </a>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const calendarEl = document.getElementById('calendar');
  const summaryCard = document.getElementById('summary-card');
  const summaryText = document.getElementById('summary-text');
  const btnClear = document.getElementById('btn-clear');
  const btnWhatsapp = document.getElementById('btn-whatsapp');
  let selectedDates = [];

  const calendar = new FullCalendar.Calendar(calendarEl, {
    initialView: 'dayGridMonth',
    locale: 'es',
    headerToolbar: {
      left: 'prev',
      center: 'title',
      right: 'next'
    },
    selectable: false,
    dateClick: function(info) {
      const clickedDate = info.dateStr;
      const dateObj = new Date(info.dateStr + 'T00:00:00');
      const today = new Date();
      today.setHours(0,0,0,0);
      
      if (dateObj < today) return;

      const dayEl = info.dayEl;
      const index = selectedDates.indexOf(clickedDate);

      if (index > -1) {
        selectedDates.splice(index, 1);
        dayEl.classList.remove('day-selected');
      } else {
        selectedDates.push(clickedDate);
        dayEl.classList.add('day-selected');
      }

      selectedDates.sort();
      updateUI();
    },
    dayCellDidMount: function(arg) {
      const dateObj = arg.date;
      const today = new Date();
      today.setHours(0,0,0,0);
      if (dateObj >= today) {
        const cell = arg.el;
        const statusEl = document.createElement('div');
        statusEl.className = 'day-status';
        statusEl.innerText = 'Disponible';
        cell.appendChild(statusEl);
      }
    }
  });

  calendar.render();

  function updateUI() {
    if (selectedDates.length > 0) {
      summaryCard.style.display = 'flex';
      btnClear.style.display = 'flex';
      btnWhatsapp.style.display = 'flex';

      let dateText = selectedDates.length === 1 ?
        `Fecha seleccionada: ${formatDate(selectedDates[0])}` :
        `Fechas seleccionadas: ${selectedDates.length} días`;

      summaryText.innerText = dateText;

      let message = `Hola, quiero reservar las siguientes fechas: ${selectedDates.map(d => formatDate(d)).join(', ')}`;
      let encodedMessage = encodeURIComponent(message);
      
      // Asegúrate de poner el número de WhatsApp correcto con su código de país
      btnWhatsapp.href = `https://wa.me/5493546555555?text=${encodedMessage}`;
    } else {
      summaryCard.style.display = 'none';
      btnClear.style.display = 'none';
      btnWhatsapp.style.display = 'none';
    }
  }

  window.clearSelection = function() {
    selectedDates = [];
    document.querySelectorAll('.day-selected').forEach(el => el.classList.remove('day-selected'));
    updateUI();
  };

  function formatDate(dateStr) {
    const parts = dateStr.split('-');
    return `${parts[2]}/${parts[1]}`;
  }
});
</script>
</body>
</html>
