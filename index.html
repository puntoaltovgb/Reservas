<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Punto Alto - Reservas</title>
<!-- FullCalendar JS -->
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

:root {
  --primary-gradient: linear-gradient(135deg, #2c3e50, #000000);
  --accent-gradient: linear-gradient(135deg, #11998e, #38ef7d);
  --whatsapp-gradient: linear-gradient(135deg, #25D366, #128C7E);
  --bg-main: #f4f6f9;
  --card-bg: #ffffff;
  --text-main: #1a1d20;
  --text-muted: #718096;
  --border-color: #edf2f7;
  --radius-lg: 24px;
  --radius-sm: 14px;
  --shadow-card: 0 20px 40px rgba(0, 0, 0, 0.06), 0 1px 3px rgba(0,0,0,0.03);
  --shadow-btn: 0 10px 20px rgba(37, 211, 102, 0.25);
}

* {
  box-sizing: border-box;
  font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  -webkit-tap-highlight-color: transparent;
}

body {
  background: var(--bg-main);
  background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
  background-size: 24px 24px;
  margin: 0;
  padding: 20px 12px;
  color: var(--text-main);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.container {
  width: 100%;
  max-width: 460px;
  background: var(--card-bg);
  padding: 28px 22px;
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
  border: 1px solid rgba(255, 255, 255, 0.8);
}

.header {
  text-align: center;
  margin-bottom: 20px;
}

.header h1 {
  font-size: 28px;
  font-weight: 800;
  margin: 0 0 8px 0;
  background: var(--primary-gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: -0.5px;
}

.instructions-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: #f1f5f9;
  color: var(--text-muted);
  padding: 8px 16px;
  border-radius: 30px;
  font-size: 13px;
  font-weight: 600;
  border: 1px solid var(--border-color);
}

/* FullCalendar Customization */
.fc {
  --fc-border-color: transparent;
  --fc-button-bg-color: #f1f5f9;
  --fc-button-border-color: transparent;
  --fc-button-text-color: var(--text-main);
  --fc-button-hover-bg-color: #e2e8f0;
  --fc-button-hover-border-color: transparent;
  --fc-button-active-bg-color: #cbd5e1;
  --fc-button-active-border-color: transparent;
  --fc-today-bg-color: transparent;
}

.fc .fc-toolbar-title {
  font-size: 18px;
  font-weight: 700;
  color: var(--text-main);
  text-transform: capitalize;
}

.fc .fc-button {
  border-radius: 12px !important;
  padding: 8px 12px;
  font-weight: 700;
  box-shadow: none !important;
  transition: all 0.2s ease;
}

.fc-theme-standard th {
  padding: 10px 0;
  background: transparent;
  color: var(--text-muted);
  font-size: 12px;
  font-weight: 700;
  border: none !important;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.fc-theme-standard td {
  border: none !important;
}

.fc-daygrid-day-frame {
  min-height: 52px !important;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  padding: 6px;
  margin: 2px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  background: #f8fafc;
}

.fc-day-future:hover {
  background: #e2e8f0 !important;
  transform: translateY(-1px);
}

.fc-daygrid-day-number {
  font-weight: 700;
  font-size: 14px;
  color: var(--text-main);
  text-decoration: none !important;
}

.fc-day-past {
  background: #f1f5f9 !important;
  opacity: 0.4;
  cursor: not-allowed;
}

/* Selección activa */
.day-selected {
  background: var(--primary-gradient) !important;
  box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
  transform: scale(0.96);
}

.day-selected .fc-daygrid-day-number {
  color: #ffffff !important;
}

.day-selected .day-status {
  color: rgba(255, 255, 255, 0.75) !important;
}

.day-status {
  font-size: 9px;
  font-weight: 700;
  color: #94a3b8;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* Leyenda */
.legend {
  display: flex;
  justify-content: center;
  gap: 18px;
  margin: 18px 0 10px 0;
  padding-top: 12px;
  border-top: 1px dashed var(--border-color);
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 8px;
}

.legend-box {
  width: 12px;
  height: 12px;
  border-radius: 4px;
}

.legend-box.available { background: #f8fafc; border: 1px solid #cbd5e1; }
.legend-box.selected { background: #1c1c1c; }

/* Panel de Acciones */
.action-panel {
  margin-top: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.summary-card {
  background: #f8fafc;
  border: 1px solid var(--border-color);
  padding: 14px 18px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--text-main);
  animation: fadeIn 0.3s ease;
}

.btn-action {
  width: 100%;
  padding: 16px;
  border-radius: var(--radius-sm);
  font-size: 15px;
  font-weight: 700;
  border: none;
  cursor: pointer;
  text-align: center;
  text-decoration: none;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  transition: all 0.2s ease;
}

.btn-clear {
  background: transparent;
  color: var(--text-muted);
  border: 1px solid var(--border-color);
  padding: 10px;
  font-size: 13px;
}

.btn-clear:hover {
  background: #f1f5f9;
  color: var(--text-main);
}

.btn-whatsapp {
  background: var(--whatsapp-gradient);
  color: #ffffff;
  box-shadow: var(--shadow-btn);
}

.btn-whatsapp:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 24px rgba(37, 211, 102, 0.35);
}

.btn-whatsapp svg {
  width: 20px;
  height: 20px;
  fill: currentColor;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>Punto Alto</h1>
    <div class="instructions-badge">
      <span>📌</span> Select las fechas para tu estadía
    </div>
  </div>

  <div id="calendar"></div>

  <div class="legend">
    <div class="legend-item">
      <div class="legend-box available"></div> Disponible
    </div>
    <div class="legend-item">
      <div class="legend-box selected"></div> Seleccionado
    </div>
  </div>

  <div class="action-panel">
    <div id="summary-card" class="summary-card" style="display: none;">
      <span>✨</span> <span id="summary-text"></span>
    </div>
    
    <a id="btn-whatsapp" href="#" target="_blank" class="btn-action btn-whatsapp" style="display: none;">
