<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Punto Alto - Reservas</title>
<!-- FullCalendar 6 Bundle -->
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
<style>
:root {
  --primary: #1c1c1c;
  --accent-bg: #f4f6f9;
  --card-bg: #ffffff;
  --text: #1c1c1c;
  --text-muted: #666666;
  --border: #e2e8f0;
  --whatsapp: #25d366;
  --radius: 16px;
}

* {
  box-sizing: border-box;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-tap-highlight-color: transparent;
}

body {
  background-color: var(--accent-bg);
  margin: 0;
  padding: 20px 12px;
  color: var(--text);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.container {
  width: 100%;
  max-width: 450px;
  background: var(--card-bg);
  padding: 24px 18px;
  border-radius: 24px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
  border: 1px solid #ffffff;
}

.header {
  text-align: center;
  margin-bottom: 16px;
}

.header h1 {
  font-size: 26px;
  margin: 0 0 6px 0;
  font-weight: 800;
  letter-spacing: -0.5px;
}

.instructions-badge {
  display: inline-block;
  background-color: #f1f5f9;
  color: var(--text-muted);
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
}

#calendar {
  margin-top: 10px;
  min-height: 320px;
}

/* Personalización limpia de FullCalendar */
.fc {
  --fc-border-color: #f1f5f9;
  --fc-button-bg-color: #1c1c1c;
  --fc-button-border-color: #1c1c1c;
  --fc-button-hover-bg-color: #333333;
  --fc-button-active-bg-color: #000000;
  --fc-today-bg-color: transparent;
}

.fc .fc-toolbar-title {
  font-size: 17px;
  font-weight: 700;
  text-transform: capitalize;
}

.fc .fc-button {
  border-radius: 10px !important;
  padding: 6px 12px !important;
  font-weight: 600;
  font-size: 12px !important;
}

.fc-theme-standard th {
  padding: 8px 0;
  background: transparent;
  color: var(--text-muted);
  font-size: 11px;
  font-weight: 700;
  border: none !important;
  text-transform: uppercase;
}

.fc-theme-standard td {
  border: none !important;
}

.fc-daygrid-day-frame {
  min-height: 48px !important;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  padding: 4px;
  margin: 2px;
  border-radius: 12px;
  cursor: pointer;
  background: #f8fafc;
  transition: all 0.15s ease;
}

.fc-day-future:hover {
  background: #e2e8f0 !important;
}

.fc-daygrid-day-number {
  font-weight: 700;
  font-size: 13px;
  color: var(--text);
  text-decoration: none !important;
}

.fc-day-past {
  background: #f1f5f9 !important;
  opacity: 0.4;
  cursor: not-allowed;
}

/* Día Seleccionado */
.day-selected {
  background: #1c1c1c !important;
}

.day-selected .fc-daygrid-day-number {
  color: #ffffff !important;
}

.day-selected .day-status {
  color: #a1a1aa !important;
}

.day-status {
  font-size: 8px;
  font-weight: 700;
  color: #94a3b8;
  text-transform: uppercase;
}

/* Panel de acciones */
.action-panel {
  margin-top: 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.summary-card {
  background: #f8fafc;
  border: 1px solid var(--border);
  padding: 12px 16px;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--text);
}

.btn-action {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 700;
  border: none;
  cursor: pointer;
  text-align: center;
  text-decoration: none;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: opacity 0.2s;
}

.btn-clear {
  background: transparent;
  color: var(--text-muted);
  border: 1px solid var(--border);
  padding: 8px;
  font-size: 13px;
}

.btn-whatsapp {
  background-color: var(--whatsapp);
  color: #ffffff;
  box-shadow: 0 8px 20px rgba(37, 211, 102, 0.25);
}

.btn-action:hover {
  opacity: 0.9;
}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>Punto Alto</h1>
    <div class="instructions-badge">📌 Tocá las fechas para tu estadía</div>
  </div>

  <div id="calendar"></div>

  <div class="action-panel">
    <div id="summary-card" class="summary-card" style="display: none;">
      ✨ <span id="summary-text"></span>
    </div>
    
    <a id="btn-whatsapp" href="#" target="_blank" class="btn-action btn-whatsapp" style="display: none;">
      Reservar por WhatsApp
    </a>

    <button id="btn-clear" class="btn-action btn-clear" style="display: none;" onclick="clearSelection()">
      Limpiar selección
    </button>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const calendarEl = document.getElementById('calendar');
  const summaryCard = document.getElementById('summary-card');
  const summaryText = document.getElementById('summary-text');
  const btnClear = document.getElementById('btn-clear');
  const btnWhatsapp = document.getElementById('btn-whatsapp');
  let selectedDates = [];

  const calendar = new FullCalendar.Calendar(calendarEl, {
    initialView: 'dayGridMonth',
    locale: 'es',
    headerToolbar: {
      left: 'prev',
      center: 'title',
      right: 'next'
    },
    selectable: false,
    dateClick: function(info) {
      const clickedDate = info.dateStr;
      const dateObj = new Date(info.dateStr + 'T00:00:00');
      const today = new Date();
      today.setHours(0,0,0,0);
      
      if (dateObj < today) return;

      const dayEl = info.dayEl;
      const index = selectedDates.indexOf(clickedDate);

      if (index > -1) {
        selectedDates.splice(index, 1);
        dayEl.classList.remove('day-selected');
      } else {
        selectedDates.push(clickedDate);
        dayEl.classList.add('day-selected');
      }

      selectedDates.sort();
      updateUI();
    },
    dayCellDidMount: function(arg) {
      const dateObj = arg.date;
      const today = new Date();
      today.setHours(0,0,0,0);
      if (dateObj >= today) {
        const cell = arg.el;
        const statusEl = document.createElement('div');
        statusEl.className = 'day-status';
        statusEl.innerText = 'Libre';
        cell.appendChild(statusEl);
      }
    }
  });

  calendar.render();

  function updateUI() {
    if (selectedDates.length > 0) {
      summaryCard.style.display = 'flex';
      btnClear.style.display = 'block';
      btnWhatsapp.style.display = 'flex';

      let dateText = selectedDates.length === 1 ?
        `Fecha: ${formatDate(selectedDates[0])}` :
        `${selectedDates.length} días seleccionados`;

      summaryText.innerText = dateText;

      let message = `Hola! Quiero consultar disponibilidad para reservar en Punto Alto en las siguientes fechas: ${selectedDates.map(d => formatDate(d)).join(', ')}`;
      let encodedMessage = encodeURIComponent(message);
      
      // Recuerda verificar tu número de WhatsApp aquí
      btnWhatsapp.href = `https://wa.me/5493546478044?text=${encodedMessage}`;
    } else {
      summaryCard.style.display = 'none';
      btnClear.style.display = 'none';
      btnWhatsapp.style.display = 'none';
    }
  }

  window.clearSelection = function() {
    selectedDates = [];
    document.querySelectorAll('.day-selected').forEach(el => el.classList.remove('day-selected'));
    updateUI();
  };

  function formatDate(dateStr) {
    const parts = dateStr.split('-');
    return `${parts[2]}/${parts[1]}`;
  }
});
</script>
</body>
</html>
